[project]
name = "hasdata-airbnb-mcp"
version = "1.0.0"
description = "MCP server for Airbnb through HasData's hosted API. No Airbnb developer account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "airbnb", "travel", "vacation-rental", "model-context-protocol", "hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/airbnb-api"
Repository = "https://github.com/HasData/airbnb-mcp"

[project.scripts]
hasdata-airbnb-mcp = "hasdata_airbnb_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_airbnb_mcp"]
